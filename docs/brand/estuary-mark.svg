<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#2f6fed"/>
      <stop offset="1" stop-color="#0d2a72"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#31d0c9"/>
      <stop offset="1" stop-color="#0f8fb8"/>
    </linearGradient>
    <linearGradient id="deep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f8fb8"/>
      <stop offset="1" stop-color="#0a4f8a"/>
    </linearGradient>
    <clipPath id="tile"><rect width="100" height="100" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="100" height="100" fill="url(#sky)"/>
    <!-- moon / sun glow -->
    <circle cx="82" cy="19" r="7.5" fill="#ffffff" opacity=".16"/>
    <!-- jib (small front sail) -->
    <path d="M47 32 L47 58 L28 58 Z" fill="#dbe7ff"/>
    <!-- main sail with the folded E: the mast is the spine, the creases are the bars -->
    <path d="M51 16 L51 58 L82 58 Z" fill="#ffffff"/>
    <path d="M55 30 H61" stroke="#0d2a72" stroke-width="2.4" stroke-linecap="round" opacity=".38"/>
    <path d="M55 41 H68" stroke="#0d2a72" stroke-width="2.4" stroke-linecap="round" opacity=".38"/>
    <path d="M55 52 H76" stroke="#0d2a72" stroke-width="2.4" stroke-linecap="round" opacity=".38"/>
    <!-- mast -->
    <path d="M49 14 V60" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"/>
    <!-- hull: level, its lower third sits below the waterline -->
    <path d="M14 60 H86 L78 76 H22 Z" fill="#ffffff"/>
    <path d="M14 60 H86 L84 64 H16 Z" fill="#c9d8ff" opacity=".9"/>
    <!-- water: drawn last so the hull is genuinely in it -->
    <path d="M-4 70 C10 64 20 76 32 70 S54 64 66 70 S88 76 104 70 V104 H-4 Z" fill="url(#sea)"/>
    <path d="M-4 70 C10 64 20 76 32 70 S54 64 66 70 S88 76 104 70" fill="none" stroke="#ffffff" stroke-width="1.6" opacity=".55"/>
    <path d="M-4 84 C10 78 20 90 32 84 S54 78 66 84 S88 90 104 84 V104 H-4 Z" fill="url(#deep)" opacity=".85"/>
  </g>
</svg>
