<!doctype html>
<html lang="en">
<head>

<style>
:root {
  color-scheme: dark;
  --bg: #0b1224; --panel: rgba(255,255,255,.045); --panel-2: rgba(255,255,255,.075);
  --line: rgba(150,180,255,.14); --line-2: rgba(150,180,255,.26);
  --fg: #e9efff; --fg-muted: #a6b3d1; --fg-faint: #8391b0;
  --blue-2: #2f6fed; --teal: #31d0c9; --teal-2: #0f8fb8; --accent: #31d0c9; --ring: #57e2dc;
}
@media (prefers-color-scheme: light) {
  :root {
    color-scheme: light;
    --bg: #eaf1fb; --panel: rgba(255,255,255,.78); --panel-2: #ffffff;
    --line: rgba(13,42,114,.14); --line-2: rgba(13,42,114,.26);
    --fg: #0a1128; --fg-muted: #46587c; --fg-faint: #5a6c8d;
    --blue-2: #1b57d0; --teal: #0a6f8f; --teal-2: #0f8fb8; --accent: #086a8b; --ring: #0d2a72;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 32px 24px;
  background: var(--bg); color: var(--fg); overflow-x: hidden; position: relative; isolation: isolate;
  font-family: 'Segoe UI Variable', 'Segoe UI', system-ui, -apple-system, Arial, sans-serif;
  font-size: 17px; line-height: 1.65; text-align: center; -webkit-font-smoothing: antialiased;
}
.tide { position: fixed; inset: -20% -10%; z-index: -1; pointer-events: none; }
.tide i { position: absolute; display: block; border-radius: 50%; filter: blur(10px); animation: drift 28s ease-in-out infinite alternate; }
.tide i:nth-child(1) { inset: -6% 34% 44% -8%; background: radial-gradient(closest-side, rgba(47,111,237,.38), transparent 72%); }
.tide i:nth-child(2) { inset: 30% -10% 6% 40%; background: radial-gradient(closest-side, rgba(49,208,201,.26), transparent 70%); animation-duration: 34s; animation-delay: -8s; }
.tide i:nth-child(3) { inset: -18% -6% 62% 46%; background: radial-gradient(closest-side, rgba(13,42,114,.5), transparent 72%); animation-duration: 30s; animation-delay: -3s; }
@media (prefers-color-scheme: light) {
  .tide i:nth-child(1) { background: radial-gradient(closest-side, rgba(47,111,237,.2), transparent 72%); }
  .tide i:nth-child(2) { background: radial-gradient(closest-side, rgba(49,208,201,.24), transparent 70%); }
  .tide i:nth-child(3) { background: radial-gradient(closest-side, rgba(91,141,239,.18), transparent 72%); }
}
@keyframes drift { 0%,100% { transform: translate3d(0,0,0) scale(1); } 50% { transform: translate3d(3%,-3%,0) scale(1.1); } }
.mark { width: clamp(96px, 20vw, 132px); height: auto; margin: 0 auto 26px; overflow: visible;
  filter: drop-shadow(0 20px 40px rgba(6,14,34,.6)); }
.mk-boat { transform-box: fill-box; transform-origin: 50% 85%; animation: sail 6.5s ease-in-out infinite; }
@keyframes sail { 0%,100% { transform: translateY(-.9px) rotate(-1.2deg); } 50% { transform: translateY(1.1px) rotate(1.2deg); } }
.mk-w1 { animation: flow 9s linear infinite; }
.mk-w2 { animation: flow 14s linear infinite reverse; }
@keyframes flow { from { transform: translateX(0); } to { transform: translateX(-40px); } }
.code { font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: var(--accent); font-weight: 700; margin: 0 0 12px; }
h1 { font-family: 'Sora', system-ui, sans-serif; font-size: clamp(30px, 6vw, 46px); letter-spacing: -.04em; line-height: 1.08; margin: 0 0 14px; }
p.lead { color: var(--fg-muted); margin: 0 auto; max-width: 460px; }
.cta { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; margin-top: 30px; }
a.btn {
  display: inline-flex; align-items: center; justify-content: center; min-height: 52px;
  padding: 13px 26px; border-radius: 13px; text-decoration: none;
  font-family: 'Sora', system-ui, sans-serif; font-size: 16px; font-weight: 600; letter-spacing: -.015em;
  border: 1px solid transparent; transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
}
a.btn:hover { transform: translateY(-2px); }
a.primary { background: linear-gradient(135deg, var(--blue-2), var(--teal-2) 118%); color: #fff; box-shadow: 0 12px 34px rgba(47,111,237,.36); }
a.secondary { background: var(--panel); color: var(--fg); border-color: var(--line-2); }
a.secondary:hover { border-color: var(--accent); background: var(--panel-2); }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 3px; border-radius: 6px; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  a.btn:hover { transform: none; }
}
</style>
</head>
