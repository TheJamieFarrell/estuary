appId: com.jamiefarrell.estuary
productName: Estuary
directories:
  buildResources: resources
  output: release
files:
  - out/**
  - package.json
  - '!**/*.map'
# The tray icons are read at runtime from process.resourcesPath/resources (see src/main/paths.ts).
extraResources:
  - from: resources
    to: resources
    filter:
      - '**/*'
  # Developer-only seeds (OAuth client ids, update source) staged by scripts/prepare-resources.mjs.
  # Empty for public builds (ESTUARY_PUBLIC=1).
  - from: build-resources
    to: .
    filter:
      - '**/*'
win:
  target:
    - target: nsis
      arch: [x64]
  # electron-builder generates the .ico from this 256px png.
  icon: resources/icon.png
  artifactName: Estuary-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  # Always install per-user (%LOCALAPPDATA%\Programs\Estuary) so in-app updates never need a UAC prompt.
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Estuary
